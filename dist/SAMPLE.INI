; Agent98 示例配置
; 复制为 AGENT98.INI（放在 exe 同目录）后修改下面的值。
; 也可以直接运行 AGENT98.EXE，在 Tools -> Settings... 里填写。

[api]
; 任意 OpenAI 兼容服务的地址，结尾不要带 /chat/completions
base=https://api.openai.com/v1
; API 密钥；Ollama 等本地服务可以留空
key=
model=gpt-4o-mini
; 1 = 流式输出，0 = 一次性返回
stream=1
max_tokens=1024
temperature=0.7
; 每行一个 Name: value，或用 | 分隔
; extra_headers=X-Title: Agent98
; system_prompt=You are Agent98...

[agent]
; 工具可以访问的目录，默认是 exe 同目录下的 workspace
workspace=C:\AGENT98\WORKSPACE
; 是否允许 run_command（执行 COMMAND.COM 命令）
allow_shell=0
; 是否允许访问 workspace 之外的路径
allow_outside=0
; 一次对话里最多几轮工具调用（0 = 不限，1~200）
max_steps=32

[tls]
; 1 = 校验服务器证书（除非有特殊原因，否则保持 1）
verify=1

[log]
; 0=ERROR 1=WARN 2=INFO 3=DEBUG 4=TRACE
level=2
